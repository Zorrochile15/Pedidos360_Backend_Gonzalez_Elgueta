spring.application.name=backend
server.port=8080

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}
cognito.client-id=${COGNITO_CLIENT_ID}

spring.cloud.aws.region.static=us-east-1

aws.sns.topic.pedidos=pedidos360-topic

aws.sqs.cola.notificaciones=cola-notificaciones
aws.sqs.cola.documentos=cola-documentos
aws.sqs.cola.prioritario=cola-prioritario

aws.sqs.dlq.notificaciones=cola-notificaciones-dlq
aws.sqs.dlq.documentos=cola-documentos-dlq
aws.sqs.dlq.prioritario=cola-prioritario-dlq
